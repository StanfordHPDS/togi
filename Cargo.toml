[workspace]
resolver = "3"
members = ["crates/togi-core", "crates/togi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/StanfordHPDS/togi"
homepage = "https://github.com/StanfordHPDS/togi"

[workspace.dependencies]
togi-core = { path = "crates/togi-core", version = "0.1.0" }

anstyle = "1.0.14"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
directories = "6"
fd-lock = "4"
flate2 = "1"
ignore = "0.4"
indicatif = "0.18.6"
inquire = "0.9.4"
rayon = "1"
self-replace = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
thiserror = "2"
toml = "0.9"
ureq = "3"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

assert_cmd = "2"
insta = "1"
predicates = "3"
tiny_http = "0.12"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
